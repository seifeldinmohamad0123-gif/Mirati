name: Build Mirati APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.MIRATI_KEYSTORE_BASE64 != '' && secrets.MIRATI_STORE_PASSWORD != '' && secrets.MIRATI_KEY_ALIAS != '' && secrets.MIRATI_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bundle Cairo Arabic font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL --retry 3 https://cdn.jsdelivr.net/fontsource/fonts/cairo@5.3.0/arabic-400-normal.woff2 -o app/src/main/assets/fonts/cairo-arabic-400-normal.woff2
          curl -fL --retry 3 https://cdn.jsdelivr.net/fontsource/fonts/cairo@5.3.0/arabic-700-normal.woff2 -o app/src/main/assets/fonts/cairo-arabic-700-normal.woff2
          test -s app/src/main/assets/fonts/cairo-arabic-400-normal.woff2
          test -s app/src/main/assets/fonts/cairo-arabic-700-normal.woff2
      - name: Validate embedded JavaScript
        run: node -e 'const fs=require("fs");const h=fs.readFileSync("app/src/main/assets/index.html","utf8");const a=h.indexOf("<script>");const b=h.indexOf("</script>",a);if(a<0||b<0)throw new Error("missing script");new Function(h.slice(a+8,b));console.log("JS syntax OK")'
      - name: Prepare persistent signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.MIRATI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mirati-release.jks"
          echo "MIRATI_KEYSTORE_PATH=$RUNNER_TEMP/mirati-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          MIRATI_STORE_PASSWORD: ${{ secrets.MIRATI_STORE_PASSWORD }}
          MIRATI_KEY_ALIAS: ${{ secrets.MIRATI_KEY_ALIAS }}
          MIRATI_KEY_PASSWORD: ${{ secrets.MIRATI_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Build debug APK (temporary until signing secrets are configured)
        if: ${{ env.HAS_RELEASE_SIGNING != 'true' }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mirati-${{ env.HAS_RELEASE_SIGNING == 'true' && 'release' || 'debug-temporary' }}-apk
          path: ${{ env.HAS_RELEASE_SIGNING == 'true' && 'app/build/outputs/apk/release/app-release.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}
          if-no-files-found: error
