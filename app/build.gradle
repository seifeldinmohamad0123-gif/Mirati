plugins { id 'com.android.application' }

android {
    namespace 'com.mirati.app'
    compileSdk 35
    signingConfigs {
        release {
            def ksPath = System.getenv('MIRATI_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('MIRATI_STORE_PASSWORD')
                keyAlias System.getenv('MIRATI_KEY_ALIAS')
                keyPassword System.getenv('MIRATI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MIRATI_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    defaultConfig {
        applicationId 'com.mirati.app'
        minSdk 23
        targetSdk 35
        // Increment both values for every published APK.
        versionCode 11
        versionName '1.1.0'
    }
}
